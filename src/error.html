<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.error.message% — Fork</title>
		<!-- SvelteKit renders this page when the app itself cannot: a crashed
		     root layout or a failed render. No app CSS reaches it, so it carries
		     Fork's bar, paper and type on its own, from the shipped fonts. -->
		<style>
			@font-face {
				font-family: 'Bitter';
				font-weight: 500;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/bitter-latin-500-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Bitter';
				font-weight: 600;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/bitter-latin-600-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Source Sans 3';
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/source-sans-3-latin-400-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Source Sans 3';
				font-weight: 500;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/source-sans-3-latin-500-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Source Sans 3';
				font-weight: 600;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/source-sans-3-latin-600-normal.woff2') format('woff2');
			}
			:root {
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				background: #f7f3ec;
				color: #1a1714;
				font-family:
					'Source Sans 3',
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				font-size: 1rem;
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}
			/* Navbar.svelte's bar: 24px (px-5) outside the 1200 cap, 52 tall on a phone. */
			.bar {
				background: #1a1408;
				height: 52px;
				padding: 0 24px;
				display: flex;
				align-items: center;
			}
			@media (min-width: 768px) {
				.bar {
					height: 56px;
				}
			}
			.inner {
				width: 100%;
				max-width: 1200px;
				margin: 0 auto;
			}
			.brand {
				display: inline-block;
				font-family: 'Bitter', Georgia, serif;
				font-size: 1.375rem;
				font-weight: 600;
				letter-spacing: -0.01em;
				color: #f7f3ec;
				text-decoration: none;
				/* 33px of line plus 18 of padding, inside the phone bar's 52. */
				padding: 9px 0;
			}
			.brand span {
				color: #eca620;
			}
			/* Centred on the screen like the login page, nothing boxed. */
			.centre {
				min-height: calc(100dvh - 56px);
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
			}
			main {
				max-width: 65ch;
				padding-bottom: 48px;
				text-align: center;
			}
			h1 {
				margin: 0;
				font-family: 'Bitter', Georgia, serif;
				font-size: clamp(1.75rem, 1.2rem + 1.8vw, 2.5rem);
				font-weight: 500;
				line-height: 1.15;
				color: #b23c00;
				text-wrap: balance;
			}
			.lede {
				margin: 8px 0 0;
				font-size: 1.0625rem;
				color: #4a443e;
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 12px;
				margin-top: 24px;
			}
			.btn-primary,
			.btn-ghost {
				display: inline-block;
				border-radius: 6px;
				color: #1a1714;
				font-size: 0.9375rem;
				line-height: 1.65;
				text-decoration: none;
			}
			.btn-primary {
				padding: 11px 16px;
				/* Transparent, so it shows only under forced colours, where the fill
				   goes and the border is all that keeps the button a box. */
				border: 1px solid transparent;
				background: #eca620;
				font-weight: 600;
			}
			.btn-primary:hover {
				background: #dc980a;
			}
			.btn-ghost {
				padding: 11px 16px;
				border: 1px solid #1a1714;
				font-weight: 600;
			}
			.btn-ghost:hover {
				background: #f5e9e0;
			}
			:focus-visible {
				outline: 2px solid #b23c00;
				outline-offset: 2px;
			}
			.bar :focus-visible {
				outline-color: #eca620;
			}
		</style>
	</head>
	<body>
		<header class="bar">
			<div class="inner">
				<!-- A line break inside the link would put a space before the stop. -->
				<!-- prettier-ignore -->
				<a href="/" class="brand">Fork<span>.</span></a>
			</div>
		</header>
		<div class="centre">
			<main>
				<h1>Error %sveltekit.status% – %sveltekit.error.message%</h1>
				<p class="lede">Something went wrong on Fork's side, not yours. Try again in a moment.</p>
				<!-- Reloads; without JavaScript the link to this same URL loads it again. -->
				<div class="actions">
					<!-- prettier-ignore -->
					<a href="" class="btn-primary" onclick="location.reload(); return false">Try again</a>
					<a href="/" class="btn-ghost">Go home</a>
				</div>
			</main>
		</div>
	</body>
</html>
