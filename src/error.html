<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · Fork</title>
		<!-- SvelteKit renders this page when the app itself cannot: a crashed
		     root layout or a failed render. No app CSS reaches it, so it carries
		     Fork's bar, paper and type on its own, from the shipped fonts. -->
		<style>
			@font-face {
				font-family: 'Bitter';
				font-weight: 500;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/bitter-latin-500-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Source Sans 3';
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/source-sans-3-latin-400-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Source Sans 3';
				font-weight: 600;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/source-sans-3-latin-600-normal.woff2') format('woff2');
			}
			:root {
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				background: #f7f3ec;
				color: #1a1714;
				font-family:
					'Source Sans 3',
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				font-size: 1rem;
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}
			.bar {
				background: #1a1408;
				height: 56px;
				display: flex;
				align-items: center;
			}
			.inner {
				width: 100%;
				max-width: 1200px;
				margin: 0 auto;
				padding: 0 24px;
			}
			@media (min-width: 1280px) {
				.inner {
					padding: 0 40px;
				}
			}
			@media (max-width: 699px) {
				.inner {
					padding: 0 18px;
				}
			}
			.brand {
				display: inline-block;
				font-family: 'Bitter', Georgia, serif;
				font-size: 1.375rem;
				font-weight: 600;
				letter-spacing: -0.01em;
				color: #f7f3ec;
				text-decoration: none;
				padding: 11px 0;
			}
			.brand span {
				color: #eca620;
			}
			main {
				max-width: 65ch;
				padding: 48px 0 64px;
			}
			h1 {
				margin: 0;
				font-family: 'Bitter', Georgia, serif;
				font-size: clamp(1.75rem, 1.2rem + 1.8vw, 2.5rem);
				font-weight: 500;
				line-height: 1.15;
				color: #b23c00;
			}
			.lede {
				margin: 8px 0 0;
				font-size: 1.0625rem;
				color: #4a443e;
			}
			.home {
				display: inline-block;
				margin-top: 24px;
				padding: 12px 16px;
				border-radius: 6px;
				background: #eca620;
				color: #1a1714;
				font-weight: 600;
				font-size: 0.9375rem;
				text-decoration: none;
			}
			.home:hover {
				background: #dc980a;
			}
			:focus-visible {
				outline: 2px solid #b23c00;
				outline-offset: 2px;
			}
			.bar :focus-visible {
				outline-color: #eca620;
			}
		</style>
	</head>
	<body>
		<header class="bar">
			<div class="inner">
				<!-- A line break inside the link would put a space before the stop. -->
				<!-- prettier-ignore -->
				<a href="/" class="brand">Fork<span>.</span></a>
			</div>
		</header>
		<div class="inner">
			<main>
				<h1>Error %sveltekit.status% – %sveltekit.error.message%</h1>
				<p class="lede">Something went wrong on Fork's side, not yours. Try again in a moment.</p>
				<a href="/" class="home">Go home</a>
			</main>
		</div>
	</body>
</html>
