<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- The F. mark (DESIGN.md, Logo). The SVG is the 16px-tuned drawing; the
		     PNGs are for browsers without SVG favicons. The touch icon is a full
		     square: iOS rounds its own corners. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/bitter-latin-500-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/source-sans-3-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<!-- The 600s too: buttons and the version chip use them above
		     the fold, so they are not discovered late (decided 29 October 2026). -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/bitter-latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/source-sans-3-latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />

		<!-- Title, description, canonical and the og/twitter cards are emitted by
		     src/routes/+layout.svelte from $page.data.meta, so a recipe link previews
		     as that recipe. Duplicating any of them here would put two of each tag in
		     the document. -->
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
