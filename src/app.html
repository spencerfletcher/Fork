<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/bitter-latin-500-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/source-sans-3-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />

		<!-- Title, description, canonical and the og/twitter cards are emitted by
		     src/routes/+layout.svelte from $page.data.meta, so a recipe link previews
		     as that recipe. Duplicating any of them here would put two of each tag in
		     the document. -->
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
