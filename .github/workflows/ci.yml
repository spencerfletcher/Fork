name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Placeholder values so svelte-kit can generate $env/static/public types.
# These are not secrets — they're only used for type generation, not runtime.
env:
  PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  # The build imports the db module, which refuses to start without a URL; the
  # client connects lazily, so a placeholder is never dialled.
  DATABASE_URL: postgresql://placeholder:placeholder@db.placeholder.invalid:5432/placeholder

jobs:
  check:
    name: Type check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates .svelte-kit/types so svelte-check can resolve $types
      - run: pnpm exec svelte-kit sync

      # Catches TypeScript and Svelte-specific type errors across all .svelte files
      - run: pnpm check

      # ESLint + Prettier format check
      - run: pnpm lint

      # A broken production build should fail here, not on Netlify.
      - run: pnpm build

  unit:
    name: Unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec svelte-kit sync

      - run: pnpm test:unit run

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pinned so a Supabase CLI release can't break CI on its own; bump deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Auth, Storage and an empty Postgres; the schema comes from db:migrate below.
      - run: supabase start

      # Publish the generated local keys and the suite's database, fork_e2e, to
      # later steps (they outrank the workflow placeholders and .env.e2e). The
      # seed and e2e users come from .env.e2e.
      - name: Export Supabase environment
        run: |
          eval "$(supabase status -o env)"
          {
            echo "PUBLIC_SUPABASE_URL=$API_URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=${DB_URL%/postgres}/fork_e2e"
          } >> "$GITHUB_ENV"

      - run: pnpm exec svelte-kit sync

      # Creates fork_e2e and replays the Drizzle chain from empty, so this job
      # also proves the migrations still build the schema from scratch. The
      # suite's global setup seeds it.
      - run: pnpm db:migrate:e2e

      # The concurrent-save test needs a real Postgres; the unit job has none,
      # so it runs here where the local stack is up.
      - run: pnpm test:unit run src/routes/recipes/[slug]/edit/page.server.db

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
